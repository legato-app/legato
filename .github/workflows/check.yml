name: check

on:
  push:
    branches: [master, platforms]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Windows = the app's platform: everything. macOS: everything too (the app shell's non-Windows build). Linux: the
  # Rust crates only (clippy + tests): the shell would need WebKitGTK, ~100 MB from Ubuntu mirrors that crawl some days
  # (review 2026-10-23: 10+ min, then a timeout), and macOS already builds it.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # macOS is the costly runner and only a Rust change can break it there (the front end's tests run the same on Windows): on
      # a push or a pull request that touches none of the Rust, the shell, the files their tests read or a workflow, its job stays green and skips the
      # rest. Anything unclear (no base commit, a failed fetch, another system) runs everything.
      - id: scope
        shell: bash
        run: |
          run=true
          if [ "$RUNNER_OS" = macOS ]; then
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            case "$base" in 0000000*) base="" ;; esac
            # No pipe into grep -q: under bash's pipefail a match cut early (SIGPIPE) or a failed diff would read as "no Rust".
            # The Rust tests also read e2e/fixtures, examples/ and release.yml (include_str!).
            if [ -n "$base" ] && git fetch --no-tags --depth=1 origin "$base" 2>/dev/null && files=$(git diff --name-only "$base" HEAD); then
              grep -qE '^(crates/|src-tauri/|Cargo\.(toml|lock)$|rust-toolchain|e2e/fixtures/|examples/|\.github/workflows/)' <<<"$files" || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "macOS: no Rust change in this push, the rest of this job is skipped."

      # Crates only: ALSA headers for the player (OpenSSL and pkg-config come with the runner). A slow Ubuntu mirror
      # used to hang `apt-get update` for 20+ minutes: short timeouts, retries, a cap on the step.
      - if: (runner.os == 'Linux') && steps.scope.outputs.run != 'false'
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do sudo apt-get $APT update && break; sleep 5; done
          sudo apt-get $APT install -y --no-install-recommends pkg-config libssl-dev libasound2-dev

      # pnpm's version, here and in every workflow, is package.json's "packageManager".
      - if: (runner.os != 'Linux') && steps.scope.outputs.run != 'false'
        uses: pnpm/action-setup@v6

      - if: (runner.os != 'Linux') && steps.scope.outputs.run != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run != 'false'
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run != 'false'

      - if: (runner.os != 'Linux') && steps.scope.outputs.run != 'false'
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the frontend build output (dist/) to exist.
      - if: (runner.os != 'Linux') && steps.scope.outputs.run != 'false'
        run: pnpm vite build

      # JS at launch under its budget (scripts/budget.mjs): a large regression fails here.
      - if: (runner.os == 'Windows') && steps.scope.outputs.run != 'false'
        run: node scripts/budget.mjs

      - run: cargo fetch --locked
        if: steps.scope.outputs.run != 'false'

      # No test may reach the network: anything but loopback goes to a dead proxy (mockito servers are on 127.0.0.1).
      - if: (runner.os != 'Linux') && steps.scope.outputs.run != 'false'
        run: pnpm check
        env:
          CARGO_NET_OFFLINE: true
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost

      # pnpm check began by writing the interface's types from the Rust ones (scripts/types.mjs): they must be what is
      # committed. Intent-to-add, so a new type's file counts too. Windows only: Linux leaves out the app crate, which
      # holds some of the types.
      - if: (runner.os == 'Windows') && steps.scope.outputs.run != 'false'
        shell: bash
        run: |
          git add --intent-to-add ui/src/shared/generated
          git diff --exit-code ui/src/shared/generated || { echo '::error::Generated types are stale: run pnpm types and commit ui/src/shared/generated'; exit 1; }

      # Legato Lite as `pnpm build:lite` builds it: the cut commands and their dependencies left out. Windows is enough.
      - if: (runner.os == 'Windows') && steps.scope.outputs.run != 'false'
        run: cargo check -p legato --no-default-features --features lite
        env:
          CARGO_NET_OFFLINE: true

      - if: (runner.os == 'Linux') && steps.scope.outputs.run != 'false'
        run: |
          cargo clippy --workspace --exclude legato --all-targets -- -D warnings
          cargo test --workspace --exclude legato
        env:
          CARGO_NET_OFFLINE: true
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost

  # The phone's shell type-checked on each push (release.yml builds the APK only at a release): what `#[cfg(desktop)]`
  # leaves out, `src/mobile/` and reqwest on rustls must still build for Android. A check, not a build: no Gradle, Java
  # or signing. Its C (ring, SQLite) goes through the runner's NDK like release.yml's; nothing is linked.
  android:
    name: check (android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # tauri::generate_context! wants dist/ there; a check never reads the page, so no Node.
      - run: mkdir -p dist && touch dist/index.html

      - name: cargo check (aarch64-linux-android)
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$ndk" ]; then
            echo "::error::No Android NDK on this runner"
            exit 1
          fi
          # minSdkVersion 26 (tauri.android.conf.json).
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang" AR_aarch64_linux_android="$bin/llvm-ar"
          cargo check --locked -p legato --lib --target aarch64-linux-android

  # The built app, driven like a new user (e2e/smoke.mjs, docs/development.md): welcome, a demo folder, a song that plays,
  # search against a loopback mock, quit. Windows only: it is WebView2's page that is driven. A debug build with the `e2e`
  # cargo feature (its own identifier, no network, no sound card needed: the engine drains a silent output). The build
  # and the walk are two steps: the walk is the one held to 5 minutes. A failure leaves screenshots and a report.
  # Blocking since 2026-11-01 (green on the 6 checks before): a failure turns `check` red and holds back the beta
  # (release.yml waits for `check` to succeed). Still outside it: the YouTube embed (network) and a real audio device.
  e2e:
    name: e2e (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A failed walk is no reason to throw the build away.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # Not provisioned by the image, only found on it: say which one runs, or that none does.
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = ('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\' + $id), ('HKCU:\Software\Microsoft\EdgeUpdate\Clients\' + $id) | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { throw 'No WebView2 runtime on this runner: the app has no window to open' }
          "WebView2 runtime $v"

      # No debug info: a smaller build and a faster link, nothing here needs a debugger.
      - run: pnpm e2e --build-only
        env:
          CARGO_PROFILE_DEV_DEBUG: 0

      - name: walk
        timeout-minutes: 5
        run: pnpm e2e --skip-build

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: target/e2e/shots
          if-no-files-found: ignore

      - if: failure()
        shell: bash
        run: echo '::error title=e2e failed::The smoke test failed. The e2e-failure artifact and this job log say why.'

  # The website as pages.yml builds it: a broken MDX page, an include gone or a type error shows here, not at the deploy.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site

  # Third-party licenses (docs/licenses.md): interface packages, then every Rust crate on every platform.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/licenses.mjs

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
