name: release

# Every push to master that passes `check` is released as a BETA: signed Windows installer + latest.json, and beside it
# the signed Android APK (its own job, attached to the same prerelease once both are done) and Legato Lite's installer +
# latest-lite.json (`lite`, the same way). Version = MAJOR.MINOR from
# tauri.conf.json + patch = commits since its bump (scripts/release.mjs BASES): 1.2.0 in the file, 1.2.<commits> released.
# "[skip release]" in the commit's first line: no release for that push. Run by hand: Actions › release › Run workflow.
# Two channels (Settings › General › Updates), two files (src-tauri/src/update.rs):
# - Beta reads releases/download/beta/latest.json: the rolling `beta` release, whose latest.json is copied here from
#   each new release (the Windows job's last step).
# - Stable reads releases/latest/download/latest.json (src-tauri/tauri.conf.json › plugins.updater, the URL every installed
#   version has always read). GitHub's "latest" skips prereleases, so it moves only when the `promote` workflow turns a
#   beta into a normal release. Nothing here may touch it.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One at a time, in push order (a newer push replaces one still waiting).
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # First line only: a body that explains the switch (2026-10-17's did) mustn't trip it.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.subject.outputs.go }}
    steps:
      - id: subject
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [[ "$subject" == *"[skip release]"* ]]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    # Windows installer and Beta's pointer; the APK builds at the same time (`android`).
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      # The commit `check` passed on (not master's tip if another push landed since).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # Patch number = commit count, notes = commits since the last tag: full history and tags.
          fetch-depth: 0

      # Signing key: repository secret (the private key never goes in the repo). Without it no updater artifacts.
      - name: Check the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing: see CONTRIBUTING.md › Releasing"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No cache in the privileged run (workflow_run, signing secrets): a poisoned one could reach the build.
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Version and notes
        id: release
        run: node scripts/release.mjs

      # Third-party notices bundled in the installer (docs/licenses.md), from this commit's Cargo.lock and
      # pnpm-lock.yaml. The release build stops if they're missing.
      # Rebuilt every time: no cache restored into this privileged run (workflow_run), where it could be poisoned.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - run: pnpm notices

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.release.outputs.version }}
          # "beta" in the title: the Discord bot (MonitoRSS) filters the releases feed on it (embed with the Beta News Ping role in
          # #updates); promote.yml renames the release without it, which is what pings Stable. scripts/promote.mjs `betaTitle`.
          releaseName: Legato v${{ steps.release.outputs.version }} beta
          releaseCommitish: ${{ env.SHA }}
          releaseBody: ${{ steps.release.outputs.notes }}
          releaseDraft: false
          # Beta only: a prerelease is never GitHub's "latest", so Stable's latest.json stays where it is.
          prerelease: true
          updaterJsonPreferNsis: true

      # Beta's file: the release called `beta` (made once, a prerelease, never "latest") carries only this latest.json (and the Lite's),
      # replaced at every release; its installer link points at the release above.
      - name: Point Beta at this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/beta"
          mkdir -p "$dir"
          gh release download "v$VERSION" --pattern latest.json --dir "$dir" --clobber
          if ! gh release view beta > /dev/null 2>&1; then
            gh release create beta --prerelease --latest=false --target "$SHA" --title "Legato Beta" \
              --notes "Only latest.json and latest-lite.json, which the Beta channels of Legato and Legato Lite read. Moves with every release; the installers are on the versioned releases."
          fi
          gh release upload beta "$dir/latest.json" --clobber

  # Android: the signed APK, built while the Windows job runs (it used to wait 14 min for it), kept as an artifact until
  # the versioned release exists (`apk`). A failure here never holds the Windows Beta back. Same commit, same version
  # (scripts/release.mjs on the same history). Keystore: repository secrets ANDROID_KEYSTORE (the .jks in base64) and
  # ANDROID_KEYSTORE_PASSWORD (store and key), alias `legato`. SDK and NDK: the runner's own.
  android:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No cache in the privileged run (workflow_run, signing secrets): a poisoned one could reach the build.
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: release
        run: node scripts/release.mjs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The APK's own notices (next step).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Android APK
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secrets ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD are missing: no APK"
            exit 1
          fi
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_HOME" ]; then
            echo "::error::No Android NDK on this runner"
            exit 1
          fi
          # Java's properties read a backslash as an escape: forward slashes.
          tmp="${RUNNER_TEMP//\\//}"
          printf '%s' "$KEYSTORE" | base64 -d > "$tmp/legato-release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=legato\n' "$tmp/legato-release.jks" "$KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
          # Android's crates (rustls, ring, Mozilla's roots) instead of Windows': the installer has its own.
          node scripts/notices.mjs aarch64-linux-android
          pnpm tauri android build --target aarch64 --apk
          mkdir -p "$tmp/apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$tmp/apk/Legato_${VERSION}_android-arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ runner.temp }}/apk
          if-no-files-found: error
          retention-days: 3

  # Legato Lite (`--features lite`, tauri.lite.conf.json, `vite --mode lite`): its own signed NSIS installer and
  # latest-lite.json, built beside the full app on its own runner. Not in the `release` job: there it would hold the APK's
  # attach back by its build time, and a Lite failure would turn the full app's job red. Not with tauri-action either: it
  # would write its own latest.json over the full app's. Same commit, same version, same updater key. Windows only for now.
  # A Lite failure fails only `lite` / `lite-attach`: nothing of the full app needs them.
  lite:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    # Under `release`'s 60: the one `release` concurrency group waits for every job, so a hung Lite holds the next Beta.
    timeout-minutes: 45
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No cache in the privileged run (workflow_run, signing secrets): a poisoned one could reach the build.
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Version and notes
        id: release
        run: node scripts/release.mjs

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - run: pnpm notices

      # NSIS only (no .msi for the Lite yet). The .sig beside the installer is the updater's signature.
      - name: Legato Lite installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing: see CONTRIBUTING.md › Releasing"
            exit 1
          fi
          pnpm tauri build --features lite --config src-tauri/tauri.lite.conf.json --bundles nsis -- --no-default-features
          out="$RUNNER_TEMP/lite"
          mkdir -p "$out"
          # GitHub turns the space into a dot anyway: name it so, and latest-lite.json's link is the asset's.
          cp "target/release/bundle/nsis/Legato Lite_${VERSION}_x64-setup.exe" "$out/Legato.Lite_${VERSION}_x64-setup.exe"
          cp "target/release/bundle/nsis/Legato Lite_${VERSION}_x64-setup.exe.sig" "$out/Legato.Lite_${VERSION}_x64-setup.exe.sig"

      # The same shape as tauri-action's latest.json (scripts/promote.mjs `withNotes` reads both).
      - name: latest-lite.json
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs")
            const { VERSION, NOTES, REPO, RUNNER_TEMP } = process.env
            const name = `Legato.Lite_${VERSION}_x64-setup.exe`
            const signature = fs.readFileSync(`${RUNNER_TEMP}/lite/${name}.sig`, "utf8").trim()
            const url = `https://github.com/${REPO}/releases/download/v${VERSION}/${name}`
            const manifest = { version: VERSION, notes: NOTES, pub_date: new Date().toISOString(), platforms: { "windows-x86_64": { signature, url } } }
            fs.writeFileSync(`${RUNNER_TEMP}/lite/latest-lite.json`, JSON.stringify(manifest, null, 2))
          '

      - uses: actions/upload-artifact@v7
        with:
          name: lite
          path: ${{ runner.temp }}/lite
          if-no-files-found: error
          retention-days: 3

  # The Lite's files onto the versioned release once the Windows job has made it, then Beta's latest-lite.json beside
  # latest.json on the rolling `beta` release (which the full app's job has made by then).
  lite-attach:
    needs: [release, lite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lite
          path: lite

      - name: Attach the Lite and point Beta at it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "v$VERSION" lite/Legato.Lite_* lite/latest-lite.json --clobber
          # A re-run of an older run's Lite jobs never takes Beta back: beta's file is left when it names a higher version.
          mkdir -p current
          gh release download beta --pattern latest-lite.json --dir current --clobber 2> /dev/null || true
          current=$(jq -r '.version // empty' current/latest-lite.json 2> /dev/null || true)
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::notice::Beta's latest-lite.json is already v$current, newer than v$VERSION: left as is"
          else
            gh release upload beta lite/latest-lite.json --clobber
          fi

  # The APK onto the versioned release, once the Windows job has made it.
  apk:
    needs: [release, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk

      - name: Attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" apk/*.apk --clobber
